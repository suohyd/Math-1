<article class="lemma theorem-like"><h3 class="heading">
<span class="type">Lemma</span><span class="space"> </span><span class="codenumber">1.1.14</span><span class="period">.</span>
</h3>
<div class="para">Suppose that <span class="process-math">\(A\in M_n(\K)\)</span> is an invertible matrix. Then, for any <span class="process-math">\(B\in M_n(\K)\text{,}\)</span> if <span class="process-math">\(AB=0\)</span> or <span class="process-math">\(BA=0\)</span> then <span class="process-math">\(B=0\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#lem-invertible-implies-no-zero-divisors-1-1" title="Copy permalink for Paragraph">🔗</a></div>
</div> <div class="para">In other words, if <span class="process-math">\(BA=0\)</span> (resp., <span class="process-math">\(AB=0\)</span>) and <span class="process-math">\(B\neq 0\)</span> then, <span class="process-math">\(A\)</span> can not be invertible.<div class="autopermalink" data-description="Paragraph"><a href="#lem-invertible-implies-no-zero-divisors-1-2" title="Copy permalink for Paragraph">🔗</a></div>
</div>
